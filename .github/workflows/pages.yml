name: Publish fictional demo
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare demo-only site
        run: |
          mkdir -p _site
          cp -R frontend/. _site/
          python - <<'PYCODE'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          assert '<head>' in s
          p.write_text(s.replace('<head>', '<head>\n  <meta name="between-mode" content="demo">', 1), encoding='utf-8')
          PYCODE
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
